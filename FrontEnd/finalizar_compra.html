<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReCloset - Revisar pedido</title>

    <link rel="stylesheet" href="css/cabecalho.css">
    <link rel="stylesheet" href="css/carrinho.css">
    <link rel="stylesheet" href="css/mensagens.css">

    <!-- Página privada: sem login, volta para a tela de login -->
    <script src="js/api.js"></script>
    <script>exigirLogin();</script>
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="cabecalho">

        <!-- LOGO -->

        <div class="logo">

            <a href="home.html">

                <img src="img/logo.png" alt="Logo ReCloset">

            </a>

        </div>


        <!-- BARRA DE PESQUISA -->

        <div class="pesquisa">

            <svg viewBox="0 -960 960 960">
                <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
            </svg>

            <input
                type="search"
                placeholder="Buscar peças, marcas..."
            >

        </div>

    </header>


    <!-- =========================
         MENU PRINCIPAL
    ========================== -->

    <nav class="menu">

        <!-- INÍCIO -->

        <a href="home.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/>
                </svg>

            </span>

            <span>Início</span>

        </a>


        <!-- FAVORITOS -->

        <a href="favoritos.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/>
                </svg>

            </span>

            <span>Favoritos</span>

        </a>


        <!-- VENDER -->

        <a href="vender.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
                </svg>

            </span>

            <span>Vender</span>

        </a>


        <!-- CARRINHO -->

        <a href="carrinho.html" class="menu-item ativo">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M360-640v-80h240v80H360ZM223.5-103.5Q200-127 200-160t23.5-56.5Q247-240 280-240t56.5 23.5Q360-193 360-160t-23.5 56.5Q313-80 280-80t-56.5-23.5Zm400 0Q600-127 600-160t23.5-56.5Q647-240 680-240t56.5 23.5Q760-193 760-160t-23.5 56.5Q713-80 680-80t-56.5-23.5ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/>
                </svg>

            </span>

            <span>Carrinho</span>

        </a>


        <!-- PERFIL -->

        <a href="perfil.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/>
                </svg>

            </span>

            <span>Perfil</span>

        </a>

    </nav>


    <!-- =========================
         REVISÃO DO PEDIDO
    ========================== -->

    <main class="conteudo-carrinho">

        <section class="carrinho-container">

            <header class="carrinho-titulo">
                <h1>Revisar pedido</h1>
            </header>

            <!-- Erros (ex.: peça vendida enquanto revisava) -->
            <div id="mensagem-revisao" class="mensagem" role="alert"></div>

            <p class="estado-lista" id="estado-revisao">Carregando pedido...</p>


            <div id="conteudo-revisao" hidden>

                <!-- ENDEREÇO -->
                <section class="bloco-revisao">
                    <div class="bloco-topo">
                        <h2>Endereço de entrega</h2>
                        <a href="meu_endereco.html?voltar=finalizar" id="link-endereco">Alterar</a>
                    </div>
                    <p id="texto-endereco"></p>
                </section>


                <!-- ITENS -->
                <section class="bloco-revisao">
                    <div class="bloco-topo">
                        <h2 id="titulo-itens">Itens</h2>
                        <a href="carrinho.html">Editar carrinho</a>
                    </div>
                </section>

                <div id="itens-revisao"></div>


                <!-- PAGAMENTO -->
                <section class="bloco-revisao">
                    <h2>Pagamento</h2>
                    <p class="aviso-pagamento">
                        Pagamento simulado (projeto acadêmico): nenhum valor será cobrado.
                    </p>
                </section>


                <!-- RESUMO (valores calculados pelo servidor) -->
                <section class="resumo-compra">

                    <div class="linha-resumo">
                        <span id="rotulo-subtotal">Subtotal</span>
                        <strong id="valor-subtotal">R$ 0,00</strong>
                    </div>

                    <div class="linha-resumo">
                        <span>Frete</span>
                        <strong id="valor-entrega">R$ 0,00</strong>
                    </div>

                    <div class="linha-total">
                        <span>Total</span>
                        <strong id="valor-total">R$ 0,00</strong>
                    </div>

                    <button type="button" class="botao-finalizar" id="botao-confirmar">
                        Confirmar pedido
                    </button>

                </section>

            </div>

        </section>

    </main>

    <script src="js/cabecalho.js"></script>
    <script src="js/finalizar_compra.js"></script>

</body>

</html>
