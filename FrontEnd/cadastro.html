
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReCloset - Cadastro</title>

    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/mensagens.css">
</head>

<body>

    <main class="pagina-cadastro">

        <section class="cadastro-container">

            <header class="logo-container">
                <img 
                    src="img/logo.png" 
                    alt="Logo do ReCloset" 
                    class="logo-img"
                >
            </header>

            <div class="cadastro-content">

                <header class="cadastro-header">
                    <h1>Criar conta</h1>
                    <p>Faça seu cadastro no ReCloset</p>
                </header>

                <form class="cadastro-form">

                    <!-- Erros do cadastro aparecem aqui -->
                    <div id="mensagem-cadastro" class="mensagem" role="alert"></div>

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label>Sexo</label>

                        <div class="opcoes-radio">

                            <label>
                                <input type="radio" name="sexo" value="feminino" required>
                                Feminino
                            </label>

                            <label>
                                <input type="radio" name="sexo" value="masculino">
                                Masculino
                            </label>

                            <label>
                                <input type="radio" name="sexo" value="outros">
                                Outros
                            </label>

                        </div>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha (mín. 8 caracteres)"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite sua senha novamente"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="button-cadastrar">
                        Criar conta
                    </button>

                </form>

                <footer class="voltar-login">

                    <p>Já possui uma conta?</p>

                    <a href="index.html" class="button-voltar">
                        Voltar para o login
                    </a>

                </footer>

            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
