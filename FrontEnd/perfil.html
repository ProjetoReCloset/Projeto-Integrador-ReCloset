            <!-- TÍTULO -->

            <header class="perfil-titulo">

                <h1>Meu Perfil</h1>

            </header>


            <!-- INFORMAÇÕES DO USUÁRIO -->

            <section class="informacoes-usuario">

                <div class="usuario-foto">

                    <img
                        id="perfil-foto"
                        src="img/sem_foto.svg"
                        alt="Foto de perfil"
                    >

                </div>


                <div class="dados-usuario">

                    <h2 id="perfil-nome">Carregando...</h2>

                    <p id="perfil-usuario"></p>

                </div>


                <button
                    class="favoritar-perfil"
                    aria-label="Favoritar perfil"
                >

                    <svg viewBox="0 0 24 24">
                        <path d="M20.8 8.7c0 5.5-8.8 10.3-8.8 10.3S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.3a4.7 4.7 0 0 1 8.8 2.4Z"/>
                    </svg>

                </button>

            </section>


            <!-- DESCRIÇÃO -->

            <p class="descricao" id="perfil-descricao"></p>


            <!-- ESTATÍSTICAS -->

            <section class="estatisticas">

                <div class="estatistica">

                    <strong id="total-produtos">0</strong>

                    <span>Produtos</span>

                </div>


                <div class="estatistica">

                    <strong id="total-vendas">0</strong>

                    <span>Vendas</span>

                </div>


                <div class="estatistica">

                    <strong id="total-favoritos">0</strong>

                    <span>Favoritos</span>

                </div>

                        </svg>

                    </span>
