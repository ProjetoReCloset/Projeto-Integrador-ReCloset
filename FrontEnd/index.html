<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReCloset - Login</title>

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/mensagens.css">
</head>

<body>

    <main class="pagina-login">

        <section class="login-container">

            <header class="logo-container">
                <img 
                    src="img/logo.png" 
                    alt="Logo do ReCloset" 
                    class="logo-img"
                >
            </header>

            <div class="login-content">

                <header class="login-header">
                    <h1>Entrar</h1>
                    <p>Acesse sua conta ReCloset</p>
                </header>

                <form class="login-form">

                    <!-- Erros do login aparecem aqui -->
                    <div id="mensagem-login" class="mensagem" role="alert"></div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input 
                            type="email" 
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input 
                            type="password" 
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>

                    <div class="esqueci-senha">
                        <a href="esqueci_senha.html">
                            Esqueceu sua senha?
                        </a>
                    </div>

                    <button type="submit" class="button-entrar">
                        Entrar
                    </button>

                </form>

                <footer class="cadastro">

                    <p>Ainda não possui uma conta?</p>

                    <a href="cadastro.html" class="buttoncadastrar">
                        Cadastrar
                    </a>

                </footer>

            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
