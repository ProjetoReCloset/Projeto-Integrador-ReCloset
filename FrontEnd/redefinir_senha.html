<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReCloset - Redefinir senha</title>

    <link rel="stylesheet" href="css/redefinir_senha.css">
    <link rel="stylesheet" href="css/mensagens.css">
</head>

<body>

    <main class="pagina-redefinir">

        <section class="redefinir-container">

            <header class="logo-container">
                <img 
                    src="img/logo.png" 
                    alt="Logo do ReCloset" 
                    class="logo-img"
                >
            </header>

            <div class="redefinir-content">

                <header class="redefinir-header">
                    <h1>Redefinir senha</h1>

                    <p>
                        Digite sua nova senha abaixo.
                    </p>
                </header>


                <form class="redefinir-form">

                    <!-- Mensagens aparecem aqui -->
                    <div id="mensagem-redefinir" class="mensagem" role="alert"></div>

                    <div class="campo">
                        <label for="nova-senha">
                            Digite a nova senha
                        </label>

                        <input 
                            type="password"
                            id="nova-senha"
                            name="nova-senha"
                            placeholder="Mínimo de 8 caracteres"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>


                    <div class="campo">
                        <label for="confirmar-senha">
                            Confirmar nova senha
                        </label>

                        <input 
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Confirme sua nova senha"
                            autocomplete="new-password"
                            required
                        >
                    </div>


                    <button type="submit" class="button-confirmar">
                        Confirmar
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/redefinir_senha.js"></script>

</body>

</html>
