<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReCloset - Vender</title>

    <link rel="stylesheet" href="css/cabecalho.css">
    <link rel="stylesheet" href="css/vender.css">
    <link rel="stylesheet" href="css/mensagens.css">

    <!-- Página privada: sem login, volta para a tela de login -->
    <script src="js/api.js"></script>
    <script>exigirLogin();</script>
</head>

<body>

    <!-- ==================== CABEÇALHO ==================== -->

    <header class="cabecalho">

        <!-- LOGO -->
        <div class="logo">
            <a href="home.html">
                <img src="img/logo.png" alt="Logo ReCloset">
            </a>
        </div>


        <!-- PESQUISA -->

            <input
                type="search"
                placeholder="Buscar peças, marcas..."
            >

        </div>

    </header>


    <!-- ==================== MENU ==================== -->

    <nav class="menu">

        <!-- INÍCIO -->
        <a href="home.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/>
                </svg>

            </span>

            <span>Início</span>

        </a>


        <!-- FAVORITOS -->
        <a href="favoritos.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/>
                </svg>

            </span>

            <span>Favoritos</span>

        </a>


        <!-- VENDER -->
        <a href="vender.html" class="menu-item ativo">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
                </svg>

            </span>

            <span>Vender</span>

        </a>


        <!-- CARRINHO -->
        <a href="carrinho.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M360-640v-80h240v80H360ZM223.5-103.5Q200-127 200-160t23.5-56.5Q247-240 280-240t56.5 23.5Q360-193 360-160t-23.5 56.5Q313-80 280-80t-56.5-23.5Zm400 0Q600-127 600-160t23.5-56.5Q647-240 680-240t56.5 23.5Q760-193 760-160t-23.5 56.5Q713-80 680-80t-56.5-23.5ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/>
                </svg>

            </span>

            <span>Carrinho</span>

        </a>


        <!-- PERFIL -->
        <a href="perfil.html" class="menu-item">

            <span class="icone">

                <svg viewBox="0 -960 960 960">
                    <path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/>
                </svg>

            </span>

            <span>Perfil</span>

        </a>

    </nav>


    <!-- ==================== CONTEÚDO ==================== -->

    <main class="conteudo">

        <form class="formulario-venda" id="form-venda" novalidate>

            <h1 id="titulo-formulario">Vender peça</h1>

            <!-- Erros aparecem aqui -->
            <div id="mensagem-venda" class="mensagem" role="alert"></div>


            <!-- FOTO DA PEÇA -->
            <div class="foto-peca">

                <label for="imagem">

                    <svg viewBox="0 -960 960 960">
                        <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm0-80q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0 400q-116 0-208-58t-138-152q-6-10-6-22t6-22q46-94 138-152t208-58q116 0 208 58t138 152q6 10 6 22t-6 22q-46 94-138 152t-208 58Z"/>
                    </svg>

                    <span>Adicionar foto</span>

                </label>

                <input
                    type="file"
                    id="imagem"
                    name="imagens"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                >

            </div>

            <!-- Miniaturas das fotos escolhidas (preenchido pelo JavaScript) -->
            <div class="previews-fotos" id="previews-fotos"></div>

            <p class="dica-fotos" id="dica-fotos">
                Adicione de 1 a 5 fotos (JPG, PNG ou WEBP, até 5 MB cada).
            </p>


            <!-- TÍTULO -->
            <div class="campo">

                <label for="titulo">
                    Título da peça
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="nome"
                    maxlength="120"
                    placeholder="Ex: Calça jeans reta"
                >
                
            </div>

            <div class="campo">

                <label for="tamanho">
                    Tamanho da peça
                </label>

                <input
                    type="text"
                    id="tamanho"
                    name="tamanho"
                    maxlength="30"
                    placeholder="Ex: Tam 38"
                >

            </div>



            <!-- CATEGORIA -->
            <div class="campo">

                <label for="categoria">
                    Categoria
                </label>

                <select id="categoria" name="categoria">

                    <option value="">
                        Selecione
                    </option>

                    <option value="feminino">
                        Feminino
                    </option>

                    <option value="masculino">
                        Masculino
                    </option>

                    <option value="acessorios">
                        Acessórios
                    </option>

                    <option value="calcados">
                        Calçados
                    </option>

                </select>

            </div>


            <!-- DESCRIÇÃO -->
            <div class="campo">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    maxlength="2000"
                    placeholder="Conte mais sobre a peça e o estado de conservação (ex.: usada poucas vezes, sem manchas)..."
                ></textarea>

            </div>


            <!-- PREÇO -->
            <div class="campo">

                <label for="preco">
                    Preço
                </label>

                <input
                    type="text"
                    id="preco"
                    name="preco"
                    inputmode="decimal"
                    placeholder="R$ 00,00"
                >

            </div>


            <!-- BOTÃO -->
            <button
                type="submit"
                class="botao-publicar"
                id="botao-publicar"
            >
                Publicar
            </button>

        </form>

    </main>

    <script src="js/vender.js"></script>

    <script src="js/cabecalho.js"></script>

</body>

</html>
